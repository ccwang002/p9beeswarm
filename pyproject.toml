[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p9beeswarm"
version = "0.1.0"
description = "Beeswarm, quasirandom, and sina geoms for plotnine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "plotnine>=0.12",
]

[project.optional-dependencies]
test = [
    "mypy>=1.13",
    "pandas-stubs>=2.2.2.240807",
    "pytest>=7",
    "pytest-cov>=6",
    "scikit-learn>=1.3",
    "scikit-learn-stubs>=0.0.3",
]
r-test = ["rpy2>=3.5"]

[dependency-groups]
lint = ["ruff>=0.16.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/p9beeswarm", "src/vipor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

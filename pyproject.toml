[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[project]
name = "p9beeswarm"
version = "0.2.0"
description = "Beeswarm, quasirandom, and sina geoms for plotnine"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt", "COPYING.txt"]
authors = [{ name = "Liang-Bo Wang", email = "me@liang2.tw" }]
requires-python = ">=3.10"
keywords = ["beeswarm", "plotnine", "quasirandom", "sina plot", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "plotnine>=0.12",
]

[project.urls]
Homepage = "https://github.com/ccwang002/p9beeswarm"
Repository = "https://github.com/ccwang002/p9beeswarm"
Issues = "https://github.com/ccwang002/p9beeswarm/issues"
Changelog = "https://github.com/ccwang002/p9beeswarm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "mypy>=1.13",
    "pandas-stubs>=2.2.2.240807",
    "pytest>=7",
    "pytest-cov>=6",
    "scikit-learn>=1.3",
    "scikit-learn-stubs>=0.0.3",
]
r-test = ["rpy2>=3.5"]

[dependency-groups]
lint = ["ruff>=0.16.3"]

[tool.uv.build-backend]
module-name = ["beeswarm", "p9beeswarm", "vipor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

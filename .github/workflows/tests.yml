name: Test package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            test_command: PYTHONPATH=src uv run --no-project pytest tests/test_swarm.py
          - python-version: "3.13"
            test_command: >-
              PYTHONPATH=src uv run --no-project pytest
              --cov=plotnine_beeswarm --cov-report=term-missing
              --cov-report=xml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra test --no-install-project

      - name: Run tests
        run: ${{ matrix.test_command }}

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: python-${{ matrix.python-version }}
          use_oidc: true
          fail_ci_if_error: false

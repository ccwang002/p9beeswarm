name: Test package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            r_tests: false
            test_command: PYTHONPATH=src uv run --no-project pytest tests/test_swarm.py
          - python-version: "3.13"
            r_tests: true
            test_command: >-
              PYTHONPATH=src uv run --no-project pytest
              --cov=plotnine_beeswarm --cov=p9beeswarm --cov=vipor --cov-report=term-missing

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up R
        if: matrix.r_tests
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R test dependencies
        if: matrix.r_tests
        run: Rscript -e 'install.packages("vipor", repos = "https://cloud.r-project.org")'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra test --no-install-project

      - name: Install R test dependencies
        if: matrix.r_tests
        run: uv sync --extra test --extra r-test --no-install-project

      - name: Run tests
        run: ${{ matrix.test_command }}
